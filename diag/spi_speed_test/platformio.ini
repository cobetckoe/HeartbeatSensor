; 诊断专用工程 —— 不动 arduino\ESP32_C3_Radar_Tracker 任何文件
; 目的: 在真实硬件 + 真实杜邦线上, 逐个测试硬件 SPI 时钟, 找出不花屏的最高频率。
; 构建: pio run -d "diag\spi_speed_test"

[platformio]
src_dir = .

[env:esp32c3]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<*>
    -<.pio/>
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit BusIO@^1.16.1
