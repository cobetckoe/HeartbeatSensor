; ESP32 Radar Tracker - unified PlatformIO project
;
; Boards:  env:esp32s3 (ESP32-S3) / env:esp32c3 (ESP32-C3)
; Source:  src/main.cpp (S3/C3 combined, selected via -DBOARD_S3 / -DBOARD_C3)
; Shared headers: include/HLK_LD2450.h, include/RadarDisplay.h
;
; Build:     pio run -e esp32s3        (or -e esp32c3)
; Upload:    pio run -e esp32s3 -t upload
; Monitor:   pio device monitor -e esp32s3

[platformio]
default_envs = esp32s3

[env]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit BusIO@^1.16.1

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
build_flags =
    -DBOARD_S3
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    -DBOARD_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1