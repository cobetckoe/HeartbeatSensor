; PlatformIO config for ESP32-C3 radar tracker sketch.
; Build from this folder:   pio run
; Upload:                   pio run -t upload
; Serial monitor:           pio device monitor

[platformio]
src_dir = .

[env:esp32c3]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Arduino HAL core debug level 0 -> log_e/log_w/log_i compile to no-ops.
    ; Required because esp_log_level_set() cannot touch the Arduino
    ; log_printf() path used by esp32-hal-spi.c:227 (spiAttachMISO).
    -DCORE_DEBUG_LEVEL=0
build_src_filter =
    +<*>
    -<.pio/>
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit BusIO@^1.16.1
    ; 涂鸦 TuyaLink MQTT（WiFi/TLS/时间库均为 ESP32 Arduino 核心自带，无需声明）
    knolleary/PubSubClient@^2.8
    ; 配网二维码编码器：纯 C、无 malloc、无浮点，实测编译进固件约 3~4KB，
    ; 适合 C3 这种只有 320KB RAM 的芯片。只用 qrcode_initText/qrcode_getModule。
    ricmoo/QRCode@^0.0.1
